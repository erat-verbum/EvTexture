version: '3.8'

services:
  evtexture:
    build: .
    ports:
      - "8001:8001"
    volumes:
      - ./data:/data
      - ./output:/output
    runtime: nvidia
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=0
    command: uvicorn src.main:app --host 0.0.0.0 --port 8001
