version: '3.8'

services:
  evtexture:
    build: .
    ports:
      - "8001:8001"
    volumes:
      - ./data:/data
      - ./output:/output
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=0
    entrypoint: []
    command: /bin/bash -c "/root/.local/bin/uv run uvicorn src.main:app --host 0.0.0.0 --port 8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
